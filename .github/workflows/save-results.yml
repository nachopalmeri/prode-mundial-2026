name: Save Results from Issue

on:
  issues:
    types: [opened]

jobs:
  save:
    if: startsWith(github.event.issue.title, 'Resultados:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Parse results from issue body
        id: parse
        run: |
          echo "results<<EOF" >> $GITHUB_OUTPUT
          cat << 'ISSUE_BODY' | grep -E '^\| *[0-9]+ *\|' | sed 's/|//g;s/^ *//' | awk '{print $1":"$2}' | tr '\n' ','
          ${{ github.event.issue.body }}
          ISSUE_BODY
          echo "EOF" >> $GITHUB_OUTPUT
      
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('data/runtime/results.json', 'utf8'));
            
            // Parse issue body for results
            const body = `${{ github.event.issue.body }}`;
            const lines = body.split('\n').filter(l => l.match(/^\| *\d+ *\|.*\|/));
            for (const line of lines) {
              const parts = line.split('|').map(s => s.trim());
              if (parts.length >= 3) {
                const id = parseInt(parts[1]);
                const score = parts[2];
                if (id && score.match(/^\d+-\d+$/)) {
                  results.results[id] = score;
                }
              }
            }
            results.last_updated = new Date().toISOString().split('T')[0];
            fs.writeFileSync('data/runtime/results.json', JSON.stringify(results, null, 2));
            
      - name: Commit and push
        run: |
          git config user.name "nachopalmeri"
          git config user.email "ipalmeri@uade.edu.ar"
          git add -A
          git commit -m "Resultados desde issue #${{ github.event.issue.number }}" || echo "No changes"
          git push
      
      - name: Add comment to issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Resultados guardados. Próximo CI/CD en ≤6h.'
            });
