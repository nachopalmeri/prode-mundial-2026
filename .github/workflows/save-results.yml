name: Save Results
on:
  issues:
    types: [opened]
jobs:
  save:
    if: startsWith(github.event.issue.title, 'Resultados')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;
            let data;
            try {
              data = JSON.parse(body);
            } catch(e) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '❌ Error: el body debe ser JSON válido. Formato: {"1":"2-0","2":"1-1"}'
              });
              return;
            }
            const current = JSON.parse(fs.readFileSync('data/runtime/results.json', 'utf8'));
            Object.entries(data).forEach(([id, score]) => { current.results[id] = score; });
            current.last_updated = new Date().toISOString().split('T')[0];
            fs.writeFileSync('data/runtime/results.json', JSON.stringify(current, null, 2));
      - run: |
          git config user.name "nachopalmeri"
          git config user.email "ipalmeri@uade.edu.ar"
          git add -A
          git commit -m "Resultados desde issue #${{ github.event.issue.number }}" || true
          git push
      - run: gh issue close ${{ github.event.issue.number }} -c "✅ Resultados guardados"
        env:
          GH_TOKEN: ${{ github.token }}
