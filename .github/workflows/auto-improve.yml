name: Auto Improve Prode Mundial 2026

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: Web Search Agents
        run: python scripts/run_web_search.py || echo "Partial results - continuing"
        continue-on-error: true
      
      - name: Run Fixture-Aware Source Agents
        run: |
          echo "=== Agentes de Fuentes Fixture-Aware ==="
          python scripts/agent_rankings.py || true
          python scripts/agent_injuries.py || true
          python scripts/agent_h2h.py || true
          python scripts/agent_polymarket.py || true
          python scripts/agent_predictions.py || true
          python scripts/agent_integrator.py "$(date -u '+%Y%m%d_%H%M')"

      - name: Dynamic Prediction Engine
        run: |
          echo "=== Motor Dinamico ==="
          python scripts/predictive_engine.py
          python scripts/update_dynamic_dashboard.py
      
      - name: Recalibrate Weights (accuracy tracking)
        run: |
          echo "=== Recalibrando Pesos ==="
          python scripts/recalibrate.py || echo "No results yet - keeping defaults"
        continue-on-error: true
      
      - name: Validate Predictions
        run: |
          echo "=== Validando Predicciones ==="
          python scripts/validate.py || echo "No results to validate yet"
        continue-on-error: true
      
      - name: Update HTML Dashboard
        run: |
          echo "=== Actualizando Dashboard ==="
          python scripts/update_html.py || echo "HTML up to date"
          python scripts/embed_accuracy.py || echo "No accuracy data to embed"
        continue-on-error: true
      
      - name: Validate HTML
        run: python scripts/validate_html.py
      
      - name: Commit changes
        run: |
          git config user.name "nachopalmeri"
          git config user.email "ipalmeri@uade.edu.ar"
          git add -A
          git commit -m "Auto: Update predictions $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"
      
      - name: Push to GitHub
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report Status
        run: |
          echo "=== Run Complete ==="
          echo "URL: https://pisculabs.vercel.app/prode-mundial-2026.html"
          echo "Time: $(date -u)"
          echo "Status: OK - Vercel will auto-deploy on push"
